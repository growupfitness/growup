<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Grow Up Fitness - Elite Supplement Store</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', 'Segoe UI', sans-serif; transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease; }
        
        :root {
            --bg-primary: #0a0e17;
            --bg-card: #141c2e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-color: #ff3366;
            --accent-gradient: linear-gradient(135deg, #ff3366, #ff6b35);
            --bg-header: rgba(10, 14, 23, 0.95);
            --logo-filter: invert(0);
        }

        [data-theme="light"] {
            --bg-primary: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: rgba(15, 23, 42, 0.08);
            --accent-color: #e11d48;
            --accent-gradient: linear-gradient(135deg, #e11d48, #f97316);
            --bg-header: rgba(255, 255, 255, 0.95);
            --logo-filter: invert(1);
        }
        
        body { 
            background: var(--bg-primary);
            color: var(--text-main); 
            min-height: 100vh;
            overflow-x: hidden;
            letter-spacing: 0.3px;
        }

        header {
            position: fixed; top: 0; left: 0; width: 100%; z-index: 100;
            background: var(--bg-header); backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border-color); padding: 10px 18px; 
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
        }

        .header-left { display: flex; align-items: center; gap: 12px; flex: 1; }
        .logo-area { cursor: pointer; display: flex; align-items: center; }

        .logo-area img#mainLogo {
            max-height: 32px; width: auto; display: block;
            filter: var(--logo-filter) !important;
        }

        .search-box { position: relative; max-width: 260px; width: 100%; }

        .search-box input {
            width: 100%; padding: 8px 12px 8px 34px;
            background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: 20px; font-size: 11px; font-weight: 600;
            color: var(--text-main); outline: none;
        }

        .search-box::before {
            content: '🔍'; position: absolute; left: 10px; top: 50%;
            transform: translateY(-50%); font-size: 12px; opacity: 0.6;
        }

        .header-controls { display: flex; align-items: center; gap: 8px; }

        .theme-toggle-btn {
            background: var(--bg-card); border: 1px solid var(--border-color);
            color: var(--text-main); padding: 6px 12px; border-radius: 20px;
            font-size: 11px; font-weight: 700; cursor: pointer;
        }

        .header-icon-btn {
            background: var(--bg-card); border: 1px solid var(--border-color);
            color: var(--text-main); width: 32px; height: 32px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 13px; position: relative;
        }

        .icon-badge {
            position: absolute; top: -4px; right: -4px; background: var(--accent-color);
            color: #ffffff; font-size: 8px; font-weight: 800; width: 15px; height: 15px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
        }

        .hero-banner {
            margin-top: 60px; position: relative; width: 100%; height: 260px;
            background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center;
        }

        .hero-banner video { width: 100%; height: 100%; object-fit: cover; opacity: 0.75; }

        .banner-text {
            position: absolute; text-align: center; color: #fff; z-index: 5; padding: 0 15px;
        }
        .banner-text h1 { font-size: 26px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; }
        .banner-text p { font-size: 12px; font-weight: 600; opacity: 0.9; margin-top: 4px; }

        .container { max-width: 1200px; margin: 0 auto; padding: 25px 15px; }

        .section-title {
            font-size: 15px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;
            margin-bottom: 15px; display: flex; align-items: center; gap: 8px; color: var(--text-main);
        }
        .section-title::before {
            content: ''; display: inline-block; width: 4px; height: 16px;
            background: var(--accent-color); border-radius: 2px;
        }

        .products-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; margin-bottom: 40px;
        }

        .prod-card {
            background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 14px;
            overflow: hidden; display: flex; flex-direction: column; position: relative;
            box-shadow: 0 6px 18px rgba(0,0,0,0.15); transition: transform 0.2s ease;
        }
        .prod-card:hover { transform: translateY(-4px); }

        .badge-discount {
            position: absolute; top: 10px; left: 10px; background: var(--accent-gradient); color: white;
            font-size: 9px; font-weight: 800; padding: 3px 8px; border-radius: 20px; z-index: 5; text-transform: uppercase;
        }

        .prod-media {
            width: 100%; height: 190px; background: rgba(255,255,255,0.02);
            display: flex; align-items: center; justify-content: center; padding: 12px; cursor: pointer;
        }
        .prod-media img { max-width: 90%; max-height: 90%; object-fit: contain; }

        .prod-details { padding: 14px; display: flex; flex-direction: column; flex-grow: 1; }
        .prod-brand { font-size: 9px; font-weight: 800; color: var(--accent-color); text-transform: uppercase; margin-bottom: 3px; }
        .prod-title { font-size: 13px; font-weight: 700; color: var(--text-main); margin-bottom: 6px; line-height: 1.3; min-height: 34px; cursor: pointer; }
        .prod-weight { font-size: 10px; color: var(--text-muted); margin-bottom: 12px; font-weight: 600; }

        .prod-pricing { display: flex; align-items: baseline; gap: 8px; margin-top: auto; margin-bottom: 12px; }
        .price-sale { font-size: 17px; font-weight: 900; color: #10b981; }
        .price-mrp { font-size: 11px; color: var(--text-muted); text-decoration: line-through; }

        .card-actions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

        .action-btn {
            padding: 9px 4px; background: var(--accent-gradient);
            color: white; border: none; font-size: 10px; font-weight: 800; border-radius: 8px;
            cursor: pointer; text-transform: uppercase; text-align: center;
        }
        .action-btn.secondary { background: transparent; color: var(--text-main); border: 1px solid var(--border-color); }

        footer { background: #05080f; color: #ffffff; padding: 30px 15px; text-align: center; border-top: 1px solid var(--border-color); }
        .footer-logo img { max-height: 30px; margin-bottom: 8px; filter: invert(0) !important; }
        .footer-text { font-size: 10px; color: #94a3b8; max-width: 400px; margin: 0 auto 12px auto; }
        .footer-credits { font-size: 9px; color: #64748b; }

        #loading { text-align: center; font-size: 12px; color: var(--accent-color); margin: 30px 0; font-weight: 800; text-transform: uppercase; }

        @media (max-width: 768px) {
            header { padding: 8px 12px; }
            .search-box { max-width: 140px; }
            .hero-banner { height: 200px; }
            .banner-text h1 { font-size: 20px; }
            .products-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .prod-media { height: 140px; }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <div class="header-left">
            <div class="logo-area" onclick="window.scrollTo({top:0, behavior:'smooth'})">
                <img src="growup-logoo.png" id="mainLogo" alt="Grow Up Fitness Logo" onerror="this.src='logo.png';">
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search Supplement..." oninput="handleSearch(this.value)">
            </div>
        </div>

        <div class="header-controls">
            <button class="theme-toggle-btn" onclick="toggleTheme()" id="themeBtn">☀️ Light</button>
            <div class="header-icon-btn">🛒 <span class="icon-badge" id="cartBadge">0</span></div>
        </div>
    </header>

    <div class="hero-banner">
        <video autoplay loop muted playsinline>
            <source src="Top-Banner.mp4" type="video/mp4">
        </video>
        <div class="banner-text">
            <h1>100% Authentic Fuel</h1>
            <p>MyLife & Premium Supplements Store</p>
        </div>
    </div>

    <div class="container">
        <h2 class="section-title">Trending Supplements</h2>
        <div id="loading">Loading Live Inventory...</div>
        <div class="products-grid" id="productsGrid"></div>
    </div>

    <footer>
        <div class="footer-logo">
            <img src="growup-logoo.png" alt="Grow Up Fitness" onerror="this.src='logo.png';">
        </div>
        <p class="footer-text">Guaranteed Authentic Products • Direct Brand Authorization</p>
        <p class="footer-credits">© 2025-2026 Grow Up Fitness Supplements Store.</p>
    </footer>

<script>
    const sheetAPI = 'https://script.google.com/macros/s/AKfycbxZ5ddxj3D0uZFWXzDsifEeHwf9XVIJ7cEp_bXW7Ug0B2V1LyLxoplV5IE7g-05jDpRJw/exec';
    let globalData = [];

    function cleanDriveUrl(url) {
        if (!url) return '';
        url = url.toString().trim();
        if (url.includes('drive.google.com/uc?')) return url;
        var id = '';
        if (url.includes('id=')) id = url.split('id=')[1].split('&')[0];
        else if (url.includes('/d/')) id = url.split('/d/')[1].split('/')[0];
        return id ? 'https://drive.google.com/uc?export=view&id=' + id : url;
    }

    function getVal(obj, possibleKeys) {
        if (!obj) return '';
        for (let key of Object.keys(obj)) {
            for (let target of possibleKeys) {
                if (key.trim().toLowerCase() === target.trim().toLowerCase()) return obj[key] ? obj[key].toString() : '';
            }
        }
        return '';
    }

    function renderProducts(data) {
        const grid = document.getElementById('productsGrid');
        grid.innerHTML = '';
        
        data.forEach((prod) => {
            const title = getVal(prod, ["Product Name", "Name", "Title"]) || 'Premium Supplement';
            const brand = getVal(prod, ["Brand"]) || 'GrowUp';
            const weight = getVal(prod, ["Weight / Size", "Weight", "Size"]);
            const flavour = getVal(prod, ["Flavour", "Flavor"]);
            const sp = parseFloat(getVal(prod, ["Selling Price", "Price", "SP"])) || 0;
            let mrp = parseFloat(getVal(prod, ["MRP"])) || 0;

            if(!mrp || mrp <= sp) mrp = Math.round(sp * 1.25);
            const offPct = Math.round(((mrp - sp) / mrp) * 100);
            const img = cleanDriveUrl(getVal(prod, ["Image 1", "Image1", "Image"]));

            const card = document.createElement('div');
            card.className = 'prod-card';
            card.innerHTML = `
                <div class="badge-discount">-${offPct}% OFF</div>
                <div class="prod-media"><img src="${img}" onerror="this.src='logo.png';"></div>
                <div class="prod-details">
                    <span class="prod-brand">${brand}</span>
                    <h3 class="prod-title">${title}</h3>
                    <span class="prod-weight">${weight} ${flavour ? '• ' + flavour : ''}</span>
                    <div class="prod-pricing">
                        <span class="price-sale">₹${sp}</span>
                        <span class="price-mrp">₹${mrp}</span>
                    </div>
                    <div class="card-actions-grid">
                        <button class="action-btn secondary">🛒 +Cart</button>
                        <button class="action-btn">Buy Now</button>
                    </div>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function handleSearch(val) {
        const filtered = globalData.filter(p => {
            const name = getVal(p, ["Product Name", "Name", "Title"]).toLowerCase();
            const brand = getVal(p, ["Brand"]).toLowerCase();
            return name.includes(val.toLowerCase()) || brand.includes(val.toLowerCase());
        });
        renderProducts(filtered);
    }

    fetch(sheetAPI)
        .then(res => res.json())
        .then(data => {
            document.getElementById('loading').style.display = 'none';
            globalData = Array.isArray(data) ? data : [];
            renderProducts(globalData);
        });

    function toggleTheme() {
        const html = document.documentElement;
        const btn = document.getElementById('themeBtn');
        if(html.getAttribute('data-theme') === 'light') {
            html.removeAttribute('data-theme');
            btn.innerText = '☀️ Light';
        } else {
            html.setAttribute('data-theme', 'light');
            btn.innerText = '🌙 Dark';
        }
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Grow Up Fitness — Fuel Your Strength</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-black: #08090c;
    --card-bg: #0e1117;
    --text-white: #ffffff;
    --text-steel: #8b949e;
    --gold: #d4af37;
    --gold-border: #f59e0b;
    --cyan: #00a0e3;
    --cyan-border: #06b6d4;
    --border-dim: rgba(255, 255, 255, 0.12);
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width: 100%;
    overflow-x: hidden;
    background: var(--bg-black);
    color: var(--text-white);
    font-family: 'Inter', sans-serif;
    scroll-behavior: smooth;
  }

  /* TOP ANNOUNCEMENT BAR */
  .top-bar {
    background: #040507;
    color: var(--text-steel);
    font-size: 11px;
    text-align: center;
    padding: 8px 12px;
    letter-spacing: 0.5px;
    border-bottom: 1px solid var(--border-dim);
  }
  .top-bar strong { color: #fff; }
  .top-bar a { color: var(--cyan); font-weight: 700; text-decoration: none; }

  /* HEADER */
  header {
    position: sticky;
    top: 0;
    z-index: 99;
    background: rgba(8, 9, 12, 0.94);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border-dim);
  }
  nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 24px;
    max-width: 1240px;
    margin: 0 auto;
    gap: 14px;
  }
  .nav-left { display: flex; align-items: center; gap: 16px; }
  .nav-right { display: flex; align-items: center; gap: 10px; }
  .nav-logo-img { height: 42px; width: auto; object-fit: contain; }

  .nav-links { display: flex; gap: 24px; font-size: 13px; font-weight: 700; }
  .nav-links a { color: var(--text-steel); text-decoration: none; transition: color 0.2s; }
  .nav-links a:hover { color: #fff; }

  .icon-btn {
    position: relative;
    background: #141822;
    border: 1px solid var(--border-dim);
    color: #fff;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
  }
  .badge {
    position: absolute;
    top: -5px; right: -5px;
    background: var(--cyan);
    color: #fff;
    font-size: 9px;
    font-weight: 800;
    width: 18px; height: 18px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }

  /* BOLT HERO TITLE BANNER (EXACT IMAGE 2 REPLICA) */
  .bolt-hero-banner {
    padding: 48px 20px 32px;
    text-align: center;
    background: radial-gradient(circle at 50% 30%, rgba(212, 175, 55, 0.08) 0%, rgba(8, 9, 12, 1) 70%);
  }
  .bolt-hero-banner h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 68px;
    letter-spacing: 3px;
    line-height: 0.95;
    margin-bottom: 8px;
    color: #ffffff;
  }
  .bolt-hero-banner h1 span {
    color: var(--gold);
    display: block;
    font-size: 76px;
    letter-spacing: 4px;
  }
  .bolt-hero-banner h2 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 38px;
    letter-spacing: 2.5px;
    color: #ffffff;
    opacity: 0.95;
  }

  /* CATEGORY FILTER BAR */
  .filter-bar-wrap {
    max-width: 1240px;
    margin: 0 auto 30px;
    padding: 0 20px;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .filter-bar-wrap::-webkit-scrollbar { display: none; }
  .filter-pill {
    background: #141822;
    border: 1px solid var(--border-dim);
    color: var(--text-steel);
    padding: 7px 16px;
    font-size: 11px;
    font-weight: 700;
    border-radius: 20px;
    cursor: pointer;
    white-space: nowrap;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    transition: all 0.2s;
  }
  .filter-pill:hover, .filter-pill.active {
    background: var(--gold);
    border-color: var(--gold);
    color: #000;
    font-weight: 800;
  }

  /* -------------------------------------------------------------
     BOLT 2-COLUMN FEATURED SHOWCASE GRID (EXACT IMAGE 2)
     ------------------------------------------------------------- */
  .bolt-showcase-container {
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 20px 60px;
  }

  .bolt-showcase-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 32px;
  }

  .bolt-card {
    background: #0a0c10;
    border-radius: 12px;
    position: relative;
    padding: 24px 22px 26px;
    display: flex;
    flex-direction: column;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
  .bolt-card:hover {
    transform: translateY(-5px);
  }

  /* THEME 1: GOLD OUTLINE CARD */
  .bolt-card.theme-gold {
    border: 2px solid var(--gold-border);
    box-shadow: 0 0 25px rgba(245, 158, 11, 0.12), inset 0 0 20px rgba(245, 158, 11, 0.03);
  }
  .bolt-card.theme-gold .bolt-card-title span { color: var(--gold); }
  .bolt-card.theme-gold .matrix-val { color: #ffffff; }
  .bolt-card.theme-gold .bottom-flavor-name { color: var(--gold); }
  .bolt-card.theme-gold .btn-action { background: var(--gold); color: #000; }

  /* THEME 2: CYAN / BLUE OUTLINE CARD */
  .bolt-card.theme-cyan {
    border: 2px solid var(--cyan-border);
    box-shadow: 0 0 25px rgba(6, 182, 212, 0.14), inset 0 0 20px rgba(6, 182, 212, 0.03);
  }
  .bolt-card.theme-cyan .bolt-card-title span { color: var(--cyan); }
  .bolt-card.theme-cyan .matrix-val { color: #ffffff; }
  .bolt-card.theme-cyan .bottom-flavor-name { color: var(--cyan); }
  .bolt-card.theme-cyan .btn-action { background: var(--cyan); color: #000; }

  /* PRODUCT IMAGE WRAPPER */
  .bolt-card-img-box {
    width: 100%;
    height: 300px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    margin-bottom: 16px;
  }
  .bolt-card-img-box img {
    max-height: 100%;
    max-width: 100%;
    object-fit: contain;
    filter: drop-shadow(0 14px 24px rgba(0,0,0,0.8));
    transition: transform 0.3s ease;
  }
  .bolt-card:hover .bolt-card-img-box img {
    transform: scale(1.05);
  }

  /* HEADINGS */
  .bolt-brand-sub {
    font-size: 11px;
    font-weight: 800;
    color: var(--text-steel);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 2px;
  }
  .bolt-card-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 38px;
    letter-spacing: 1.5px;
    line-height: 1;
    color: #ffffff;
    margin-bottom: 4px;
    text-transform: uppercase;
  }
  .bolt-tagline {
    font-size: 10px;
    font-weight: 700;
    color: #64748b;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 18px;
  }

  /* 4 SEPARATE BORDERED NUTRITION BOXES */
  .bolt-nutrition-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }
  .bolt-nutrition-box {
    background: #06070a;
    border: 1px solid var(--border-dim);
    border-radius: 4px;
    padding: 10px 4px;
    text-align: center;
  }
  .matrix-val {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 24px;
    letter-spacing: 0.5px;
    line-height: 1;
    display: block;
  }
  .matrix-lbl {
    font-size: 9px;
    font-weight: 800;
    color: var(--text-steel);
    text-transform: uppercase;
    margin-top: 4px;
    display: block;
    letter-spacing: 0.5px;
  }

  /* FLAVOR HIGHLIGHT STRIP */
  .bolt-feature-strip {
    background: #06070a;
    border: 1px solid var(--border-dim);
    border-radius: 4px;
    padding: 9px 12px;
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    color: #cbd5e1;
    letter-spacing: 0.5px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  /* TRUST PILLS ROW */
  .bolt-trust-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-bottom: 14px;
  }
  .trust-tag {
    background: #06070a;
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 4px;
    padding: 6px 8px;
    font-size: 9px;
    font-weight: 800;
    color: #64748b;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    text-align: center;
  }

  /* BOTTOM FLAVOR NAME */
  .bottom-flavor-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  /* PRICE & ORDER FOOTER */
  .bolt-card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 14px;
    border-top: 1px dashed var(--border-dim);
    margin-top: auto;
  }
  .bolt-price {
    font-size: 22px;
    font-weight: 900;
    color: #fff;
  }
  .bolt-mrp {
    font-size: 12px;
    color: #64748b;
    text-decoration: line-through;
    margin-left: 6px;
    font-weight: 500;
  }
  .btn-action {
    border: none;
    padding: 10px 18px;
    font-size: 12px;
    font-weight: 900;
    border-radius: 4px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* MODALS */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    z-index: 200; align-items: center; justify-content: center; padding: 16px;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: #0e1117; max-width: 500px; width: 100%; border-radius: 8px;
    border: 1px solid var(--border-dim); padding: 24px; position: relative;
  }
  .modal-close {
    position: absolute; top: 12px; right: 12px; background: none; border: none;
    color: #fff; font-size: 18px; cursor: pointer;
  }

  /* RESPONSIVE LAYOUT */
  @media (max-width: 820px) {
    .bolt-hero-banner h1 { font-size: 46px; }
    .bolt-hero-banner h1 span { font-size: 52px; }
    .bolt-hero-banner h2 { font-size: 26px; }
    .bolt-showcase-grid { grid-template-columns: 1fr; gap: 24px; }
    .bolt-card-img-box { height: 240px; }
    .bolt-card-title { font-size: 32px; }
    .matrix-val { font-size: 20px; }
  }
</style>
</head>
<body>

<div class="top-bar">
  <strong>100% Genuine &amp; Importer Certified Supplements</strong> &nbsp;·&nbsp; Call/WhatsApp: <a href="tel:9571214461">95712 14461</a>
</div>

<header>
  <nav>
    <div class="nav-left">
      <a href="home.html" style="text-decoration:none;">
        <img src="https://github.com/growupfitness/growup/blob/main/growup-logoo.png?raw=true" alt="Grow Up Fitness" class="nav-logo-img">
      </a>
    </div>

    <div class="nav-links">
      <a href="home.html">Classic Store</a>
      <a href="#showcase" style="color:var(--gold);">⚡ Showcase</a>
      <a href="tel:9571214461">Direct Support</a>
    </div>

    <div class="nav-right">
      <button class="icon-btn" onclick="openCartDrawer()" title="Cart">🛒<span class="badge" id="cartBadge" style="display:none;">0</span></button>
    </div>
  </nav>
</header>

<!-- HERO SECTION: EXACT REPLICA OF IMAGE 2 -->
<section class="bolt-hero-banner">
  <h1>FUEL YOUR <span>STRENGTH</span></h1>
  <h2>BUILD YOUR BEST</h2>
</section>

<!-- CATEGORY FILTER -->
<div class="filter-bar-wrap">
  <button class="filter-pill active" onclick="filterByCategory('all', this)">All Featured</button>
  <button class="filter-pill" onclick="filterByCategory('protein', this)">Whey Protein</button>
  <button class="filter-pill" onclick="filterByCategory('isolate', this)">Whey Isolate</button>
  <button class="filter-pill" onclick="filterByCategory('creatine', this)">Creatine</button>
  <button class="filter-pill" onclick="filterByCategory('pre-workout', this)">Pre-Workout</button>
</div>

<!-- MAIN 2-COLUMN BOLT POSTER GRID -->
<div class="bolt-showcase-container" id="showcase">
  <div class="bolt-showcase-grid" id="boltShowcaseGrid">
    <p style="color:var(--text-steel); grid-column:1/-1; text-align:center; padding:60px 0;">Loading Bolt Nutrition Matrix Showcase...</p>
  </div>
</div>

<!-- CART DRAWER -->
<div class="modal-overlay" id="cartDrawer">
  <div class="modal-box">
    <button class="modal-close" onclick="closeCartDrawer()">✕</button>
    <h2 style="font-family:'Bebas Neue'; font-size:24px; margin-bottom:16px;">YOUR CART</h2>
    <div id="cartItemsWrap"></div>
  </div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbx-t9D0vWFWsNtD6GgHHr3SojREUR55Lvp02ZtlNNhXArxRy3VPzRGO5serEpixPZZN/exec";

  let allProducts = [];
  let displayProducts = [];
  let cart = [];

  async function loadProducts() {
    const grid = document.getElementById("boltShowcaseGrid");
    grid.innerHTML = `<p style="color:var(--text-steel); grid-column:1/-1; text-align:center; padding:60px 0;">Loading Bolt Nutrition Matrix Showcase...</p>`;

    try {
      const res = await fetch(`${API_URL}?action=getProducts&_t=${new Date().getTime()}`);
      const data = await res.json();

      if (!Array.isArray(data) || data.length === 0) {
        grid.innerHTML = `<p style="color:var(--text-steel); grid-column:1/-1; text-align:center;">Sheet me koi products nahi mile.</p>`;
        return;
      }

      allProducts = data;

      const uniqueMap = new Map();
      allProducts.forEach(p => {
        const key = (p["Product Name"] || "").trim() + "_" + (p["Weight / Size"] || "").trim();
        if (!uniqueMap.has(key)) uniqueMap.set(key, p);
      });
      displayProducts = Array.from(uniqueMap.values());

      renderBoltCards();
    } catch (e) {
      grid.innerHTML = `<p style="color:var(--text-steel); grid-column:1/-1; text-align:center;">Products load nahi ho paye. <br><button onclick="loadProducts()" class="filter-pill" style="margin-top:12px;">Retry</button></p>`;
    }
  }

  function renderBoltCards() {
    const grid = document.getElementById("boltShowcaseGrid");
    if (displayProducts.length === 0) {
      grid.innerHTML = `<p style="color:var(--text-steel); grid-column:1/-1; text-align:center; padding:40px 0;">No supplements found in this category.</p>`;
      return;
    }

    grid.innerHTML = "";

    displayProducts.forEach((p, index) => {
      // Alternate Theme: Odd index Gold border, Even index Cyan border (Just like Image 2)
      const themeClass = (index % 2 === 0) ? 'theme-gold' : 'theme-cyan';

      const mrp = Number(p["MRP"]) || 0;
      const selling = Number(p["Selling Price"]) || 0;
      const pid = p["Product ID"] || p["Product Name"];

      // Nutrition Columns fetched from your Google Sheet
      const cal = p["Calories"] ? String(p["Calories"]).replace(/[^0-9]/g, "") : "125";
      const pro = p["Protein"] ? String(p["Protein"]).replace(/[^0-9]/g, "") + "G" : "25G";
      const bcaa = p["BCAA"] ? String(p["BCAA"]).replace(/[^0-9]/g, "") + "G" : "6G";
      const srv = p["Servings"] ? String(p["Servings"]).replace(/[^0-9]/g, "") : "30";

      const weight = p["Weight / Size"] || "Standard Size";
      const flavour = p["Flavour"] || "Premium Flavour";

      const card = document.createElement("div");
      card.className = `bolt-card ${themeClass}`;
      card.innerHTML = `
        <div class="bolt-card-img-box">
          <img src="${p["Image 1"] || ""}" onerror="this.src='https://github.com/growupfitness/growup/blob/main/growup-logoo.png?raw=true'">
        </div>

        <div class="bolt-brand-sub">${p["Brand"] || "BOLT NUTRITION"}</div>
        <div class="bolt-card-title">${p["Product Name"] || "WHEY PROTEIN"}</div>
        <div class="bolt-tagline">SUPER-CHARGED FOR ELITE STRENGTH &amp; RECOVERY</div>

        <!-- 4 NUTRITION BOXES -->
        <div class="bolt-nutrition-row">
          <div class="bolt-nutrition-box">
            <span class="matrix-val">${cal}</span>
            <span class="matrix-lbl">CAL</span>
          </div>
          <div class="bolt-nutrition-box">
            <span class="matrix-val">${pro}</span>
            <span class="matrix-lbl">PROTEIN</span>
          </div>
          <div class="bolt-nutrition-box">
            <span class="matrix-val">${bcaa}</span>
            <span class="matrix-lbl">BCAA</span>
          </div>
          <div class="bolt-nutrition-box">
            <span class="matrix-val">${srv}</span>
            <span class="matrix-lbl">SERVINGS</span>
          </div>
        </div>

        <!-- FEATURE HIGHLIGHT STRIP -->
        <div class="bolt-feature-strip">
          <span>⚡ ${weight}</span>
          <span>${flavour}</span>
        </div>

        <!-- TRUST BADGES -->
        <div class="bolt-trust-grid">
          <div class="trust-tag">✓ BANNED TESTED</div>
          <div class="trust-tag">✓ NO ADDED SUGAR</div>
          <div class="trust-tag">✓ GLUTEN FREE</div>
          <div class="trust-tag">✓ 100% GENUINE</div>
        </div>

        <!-- BOTTOM FLAVOR NAME -->
        <div class="bottom-flavor-name">${flavour}</div>

        <!-- FOOTER: PRICE & CTA -->
        <div class="bolt-card-footer">
          <div>
            <span class="bolt-price">₹${selling}</span>
            ${mrp > selling ? `<span class="bolt-mrp">₹${mrp}</span>` : ''}
          </div>
          <button class="btn-action" onclick="orderWhatsApp('${escapeQuotes(p["Product Name"])}', '${selling}', '${weight}', '${flavour}')">Order Now</button>
        </div>
      `;

      grid.appendChild(card);
    });
  }

  function filterByCategory(keyword, btnEl) {
    document.querySelectorAll('.filter-pill').forEach(el => el.classList.remove('active'));
    if (btnEl) btnEl.classList.add('active');

    if (keyword === 'all') {
      const uniqueMap = new Map();
      allProducts.forEach(p => {
        const key = (p["Product Name"] || "").trim() + "_" + (p["Weight / Size"] || "").trim();
        if (!uniqueMap.has(key)) uniqueMap.set(key, p);
      });
      displayProducts = Array.from(uniqueMap.values());
    } else {
      const q = keyword.toLowerCase().trim();
      const matched = allProducts.filter(p => {
        const cat = (p["Category"] || "").toLowerCase();
        const name = (p["Product Name"] || "").toLowerCase();
        return cat.includes(q) || name.includes(q);
      });

      const uniqueMap = new Map();
      matched.forEach(p => {
        const key = (p["Product Name"] || "").trim() + "_" + (p["Weight / Size"] || "").trim();
        if (!uniqueMap.has(key)) uniqueMap.set(key, p);
      });
      displayProducts = Array.from(uniqueMap.values());
    }

    renderBoltCards();
  }

  function orderWhatsApp(name, price, weight, flavour) {
    const text = encodeURIComponent(`Hi Grow Up Fitness, I want to order:\n*${name}*\nSize: ${weight}\nFlavour: ${flavour}\nPrice: ₹${price}`);
    window.open(`https://wa.me/919571214461?text=${text}`, '_blank');
  }

  function escapeQuotes(str) {
    return String(str || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
  }

  function openCartDrawer() { document.getElementById("cartDrawer").classList.add("open"); }
  function closeCartDrawer() { document.getElementById("cartDrawer").classList.remove("open"); }

  loadProducts();
</script>
</body>
</html>
